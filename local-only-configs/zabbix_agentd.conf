# Local lab file for the Zabbix agent on db01.
# Install as: /etc/zabbix/zabbix_agentd.conf   (then: sudo systemctl restart zabbix-agent)
# Server and ServerActive are the IP of zbx01. Hostname must match the host name in the frontend.
PidFile=/run/zabbix/zabbix_agentd.pid
LogFile=/var/log/zabbix/zabbix_agentd.log
LogFileSize=0
Server=192.168.118.128
ServerActive=192.168.118.128
Hostname=db01
HostMetadataItem=system.uname
RefreshActiveChecks=120
BufferSend=5
BufferSize=100
Timeout=3
Include=/etc/zabbix/zabbix_agentd.d/*.conf
